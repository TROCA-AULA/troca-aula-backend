name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      # eslint sem --fix: no CI queremos detectar, nao reescrever arquivos
      run: npx eslint "src/**/*.ts" "test/**/*.ts"

    - name: Run Build
      run: pnpm run build

    - name: Run Tests (com cobertura minima de 90%)
      # Testes unitarios nao precisam de DATABASE_URL real (repositories mockados).
      # O script com --coverage aplica o coverageThreshold global (90%) do package.json.
      run: pnpm run test:cov

    - name: Run E2E Tests
      # E2E de wiring: o spec define um DATABASE_URL sintatico e nao toca o banco
      run: pnpm run test:e2e
