name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    # PRs do Dependabot não têm "issue info" no contexto e faziam a action
    # falhar ("Couldn't find issue info in current context") - pula esses.
    if: github.actor != 'dependabot[bot]'
    permissions:
      issues: write
      pull-requests: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@v1
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: trocaaula
          numOfAssignee: 1
